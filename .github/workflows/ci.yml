name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Fast pre-merge signal ────────────────────────────────────────────
  # Only the determinism core of sim-core (kernel oracle/golden tests, the
  # pipeline determinism suite, the replay ×100 digest gate). No typecheck,
  # no builds — green in minutes so regressions surface before the full
  # matrix finishes. See .github/workflows/README.md.
  determinism:
    name: Determinism gates (×100)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: sim-core determinism (kernel + pipeline + replay)
        run: pnpm -F @hh/sim-core exec vitest run src/kernel src/pipeline src/replay

  # ── Full verify matrix ───────────────────────────────────────────────
  verify:
    name: Verify · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      # pnpm version is taken from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        if: matrix.node != '20.x'
        run: pnpm -r test

      # headless-tools declares engines >=22.18 (its parity/cli suites spawn
      # `node --experimental-transform-types`, a Node >=22.7 flag) and proto's
      # jsdom component tests need jsdom's structuredClone markAsUncloneable
      # hook (Node >=22). The 20.x arm therefore certifies the portability
      # claim that matters — @hh/sim-core (the library the Node port embeds)
      # typechecks and runs its full deterministic suite on Node 20 — while
      # apps are tested on 22.x per their own engines contracts.
      - name: Test (Node-20-compatible packages)
        if: matrix.node == '20.x'
        run: pnpm -r --filter '@hh/sim-core' test

      # ── Contract gates ───────────────────────────────────────────────
      # Project-wide invariants (docs currency, content schema, runtime
      # neutrality, bundling) — runtime-version independent, so they run
      # once, on the 22.x arm. Devs mirror them with:
      #   node scripts/ci-verify.mjs
      - name: "Contract: API-reference drift tripwire"
        if: matrix.node == '22.x'
        run: node docs/api-verify.test.mjs

      - name: "Contract: content corpus validator"
        if: matrix.node == '22.x'
        run: node packages/content/script/validate.mjs

      # Real invocation (no invented flags): the package's own `canary` script
      # = node --experimental-transform-types src/cli.ts canary. It defaults to
      # scanning packages/sim-core/src and already exits 1 on violations.
      - name: "Contract: forbidden-API canary (sim-core)"
        if: matrix.node == '22.x'
        run: pnpm -F headless-tools canary

      - name: "Contract: proto web build"
        if: matrix.node == '22.x'
        run: pnpm -F proto build
