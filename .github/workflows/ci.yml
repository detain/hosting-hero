name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Fast pre-merge signal ────────────────────────────────────────────
  # The FULL deterministic surface of sim-core: every src dir that carries a
  # ×100 byte-identity replay gate (kernel oracle/golden, pipeline determinism
  # + intent-door ×100, replay harness, policy, economy, observed, topology,
  # save, coverage, versus, unattended, loader) plus the root __tests__ gate
  # suites (G1–G6, each re-runs its scenario ×100 through replay.createHarness)
  # and waves (unit-level seed-stability: same seed ⇒ same draw/deferral —
  # the layer every ×100 gate rides on; 1.2 s). src/internal/ has no tests.
  # Worst-case serial ceiling ≈3 min (measured 3m03s serial; file-parallel
  # ≈40 s; 98 files / 1420 tests) — far under the ~5 min pre-merge budget,
  # so no risk-weighted pruning was needed. No typecheck, no builds, no apps.
  #
  # Timing tests INCLUDED by decision: the three contention-adaptive floors
  # (unattended fastForward 2000-tick calibrated wall, policy perf-hotpath
  # paired-calibration ≥2× ratio, pipeline serve-bench clamped tps floor) run
  # here too. Rationale: each self-calibrates against in-test machine speed
  # (serve-bench precedent), so runner contention shrinks the budget WITH the
  # measurement instead of producing false reds — and they are determinism-
  # adjacent witnesses (ghost-regression queue shapes, memo-vs-naive digest
  # twins, limb-path byte identity). They additionally ride the matrix Test
  # step; a red here still names the same failing file.
  # See .github/workflows/README.md for the gate census.
  determinism:
    name: Determinism gates (×100)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: sim-core determinism (all ×100-gated dirs, one invocation)
        run: >
          pnpm -F @hh/sim-core exec vitest run
          src/kernel src/pipeline src/replay
          src/policy src/economy src/observed src/topology
          src/save src/coverage src/versus src/unattended
          src/loader src/waves src/__tests__

  # ── Full verify matrix ───────────────────────────────────────────────
  # Arms: 22.x = baseline (matches root engines floor ">=22"; also hosts the
  # contract gates below) · 24.x = next-LTS forward-compat probe. Node 20.x was
  # dropped by owner ratification 2026-10-09 (ADR-0009) — it was never a real
  # support claim: root engines says >=22 and headless-tools >=22.18, so the
  # old 20.x arm only ever certified a --filtered sim-core subset. Both arms
  # now satisfy every package's engines contract, so both run the FULL suite.
  verify:
    name: Verify · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      # pnpm version is taken from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # ── Contract gates ───────────────────────────────────────────────
      # Project-wide invariants (docs currency, content schema, runtime
      # neutrality, bundling) — runtime-version independent, so they run
      # ONCE, anchored to the 22.x baseline arm: re-executing the identical
      # checks on 24.x would spend minutes for zero new signal (the 24.x
      # arm's value is the full Test step above). Devs mirror them with:
      #   node scripts/ci-verify.mjs
      - name: "Contract: API-reference drift tripwire"
        if: matrix.node == '22.x'
        run: node docs/api-verify.test.mjs

      - name: "Contract: content corpus validator"
        if: matrix.node == '22.x'
        run: node packages/content/script/validate.mjs

      # Real invocation (no invented flags): the package's own `canary` script
      # = node --experimental-transform-types src/cli.ts canary. It defaults to
      # scanning packages/sim-core/src and already exits 1 on violations.
      - name: "Contract: forbidden-API canary (sim-core)"
        if: matrix.node == '22.x'
        run: pnpm -F headless-tools canary

      - name: "Contract: proto web build"
        if: matrix.node == '22.x'
        run: pnpm -F proto build

      # The G5 fixture is a rootDir-law-forced (TS6059) byte-identical mirror
      # of apps/proto/src/gates/g5/quarter.ts below its declared TEST FIXTURE
      # MIRROR header (SYNC LAW in the header: edit upstream first, re-copy
      # after). The comparison logic lives in the pre-push mirror script and
      # is invoked standalone here to match the individual-step style.
      - name: "Contract: G5 fixture mirror diff (SYNC LAW)"
        if: matrix.node == '22.x'
        run: node scripts/ci-verify.mjs g5-mirror-diff
